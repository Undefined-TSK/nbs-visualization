<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BlockFrame Sample</title>
<style>
  @font-face { font-family: "CJK"; src: local("Noto Sans CJK SC"); font-weight: 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Nimbus Sans", "Noto Sans CJK SC", sans-serif;
    color: #000;
    background: #FFFDF5;
    background-image: radial-gradient(rgba(0,0,0,0.16) 1.6px, transparent 1.6px);
    background-size: 26px 26px;
  }
  [data-composition-id="styleA"] { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #gl { position: absolute; inset: 0; }

  /* chrome */
  .pill {
    position: absolute; display: inline-flex; align-items: center; gap: 10px;
    background: #fff; border: 3px solid #000; border-radius: 999px;
    padding: 10px 22px; font: 700 20px/1 "Fira Code", monospace;
    letter-spacing: .08em; text-transform: uppercase;
    box-shadow: 4px 4px 0 #000;
  }
  .pill.yellow { background: #F7CB46; }
  .pill.pink { background: #FE90E8; }
  .pill.blue { background: #C0F7FE; }
  .pill.green { background: #99E885; }

  #tag { position: absolute; top: 56px; left: 64px; }
  #counter { position: absolute; top: 56px; right: 64px; background: #000; color: #fff; box-shadow: 4px 4px 0 #F7CB46; }

  /* display title */
  .title-wrap { position: absolute; left: 64px; bottom: 74px; max-width: 900px; }
  .title-kicker { font: 700 18px/1 "Fira Code", monospace; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 14px; }
  .title {
    font-family: "Noto Sans CJK SC", "Nimbus Sans", sans-serif;
    font-weight: 900; font-size: 92px; line-height: 0.94;
    letter-spacing: -0.035em; text-transform: uppercase;
  }
  .title .hl { background: #F7CB46; box-shadow: 6px 6px 0 #000; padding: 0 .08em; display: inline-block; }

  /* decorations */
  .star {
    position: absolute; width: 132px; height: 132px; background: #FE90E8;
    border: 3px solid #000;
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  #star1 { top: 150px; right: 120px; transform: rotate(12deg); }
  .tilt-rect {
    position: absolute; width: 220px; height: 84px; background: #C0F7FE;
    border: 3px solid #000; box-shadow: 6px 6px 0 #000; transform: rotate(-4deg);
  }
  #rect1 { top: 300px; right: 90px; }

  /* block labels */
  .blabel {
    position: absolute; transform: translate(-50%, -50%);
    background: #000; color: #fff; font: 700 15px/1 "Fira Code", monospace;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 5px 9px; white-space: nowrap; border-radius: 3px;
    will-change: transform, opacity;
  }
  .blabel .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; vertical-align: middle; }

  /* lyric */
  #lyric {
    position: absolute; left: 50%; bottom: 190px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #lyric .w {
    font-family: "Noto Sans CJK SC", sans-serif; font-weight: 900;
    font-size: 62px; line-height: 1; color: #000;
    background: #fff; border: 3px solid #000; box-shadow: 5px 5px 0 #000;
    padding: 8px 16px 12px; opacity: 0; will-change: transform;
  }
  #lyric .w.on { background: #F7CB46; }

  .footer-line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #000;
  }
</style>
</head>
<body>
<div data-composition-id="styleA" data-width="1920" data-height="1080"
     data-start="0" data-duration="%%DURATION%%" data-track-index="0">
  <canvas id="gl" width="1920" height="1080"></canvas>

  <div class="pill" id="tag">■ NBS VISUALIZER</div>
  <div class="pill" id="counter">00:00</div>

  <div class="star" id="star1"></div>
  <div class="tilt-rect" id="rect1"></div>

  <div class="title-wrap">
    <div class="title-kicker" id="kicker">TRACKS · BLOCKS · BEATS</div>
    <div class="title" id="title"></div>
  </div>

  <div id="lyric"></div>
  <div class="footer-line"></div>
</div>
%%AUDIO_CLIP%%
<script src="three.min.js"></script>
<script src="blocks-engine.js"></script>
<script src="gsap.min.js"></script>
<script src="song_data.js"></script>
<script>
(function () {
  var D = window.SONG_DATA, INTRO = %%INTRO%%, SONG = D.meta.duration;
  var DUR = INTRO + SONG + 1.6;

  document.getElementById("title").innerHTML =
    '<span class="hl">' + D.meta.name + '</span>';
  document.getElementById("kicker").textContent =
    (D.meta.author || "NBS") + " · " + D.tracks.length + " TRACKS · " + D.meta.tempo + " TPS";

  var colors = ["#FE90E8", "#C0F7FE", "#99E885", "#F7CB46", "#FFDC8B"];

  var labelLayer = [];
  function makeLabels(n) {
    for (var i = 0; i < n; i++) {
      var el = document.createElement("div");
      el.className = "blabel";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = colors[i % colors.length];
      el.appendChild(dot);
      el.appendChild(document.createTextNode(D.tracks[i].role));
      el.style.opacity = "0";
      document.body.appendChild(el);
      labelLayer.push(el);
    }
  }
  makeLabels(D.tracks.length);

  function counter(t) {
    var s = Math.max(0, Math.min(SONG, t));
    var m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return (m < 10 ? "0" + m : m) + ":" + (ss < 10 ? "0" + ss : ss);
  }

  var engine = HF3D.create({
    canvas: document.getElementById("gl"),
    data: D, width: 1920, height: 1080,
    outline: true, shadow: true, orbit: false,
    bornAt: function (i) { return 0.25 + i * 0.13; },
    onFrame: function (t, blocks) {
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i], el = labelLayer[i];
        if (!b || !el) continue;
        var vis = b.screen.visible && t > 0.2;
        el.style.opacity = vis ? "1" : "0";
        if (!vis) continue;
        var rise = 62 + b.energy * 10;
        el.style.transform = "translate(-50%,-50%) translate(" + b.screen.x.toFixed(1) + "px," +
          (b.screen.y + rise).toFixed(1) + "px) scale(" + (1 + b.energy * 0.1).toFixed(3) + ")";
      }
      document.getElementById("counter").textContent = counter(t);
    }
  });

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  tl.from("#tag", { y: -40, opacity: 0, duration: .45, ease: "power3.out" }, .05);
  tl.from("#counter", { y: -40, opacity: 0, duration: .45, ease: "power3.out" }, .12);
  tl.from("#title", { y: 90, opacity: 0, duration: .55, ease: "power4.out" }, .18);
  tl.from("#kicker", { y: 30, opacity: 0, duration: .4, ease: "power2.out" }, .32);
  tl.from("#star1", { scale: 0, rotation: -60, opacity: 0, duration: .5, ease: "back.out(1.7)" }, .3);
  tl.from("#rect1", { x: 140, opacity: 0, duration: .5, ease: "power3.out" }, .42);

  var state = { t: 0 };
  tl.to(state, {
    t: SONG, duration: SONG, ease: "none",
    onUpdate: function () { engine.render(state.t); }
  }, INTRO);

  /* 歌词快闪：4 个词，各 0.5s，落点与音符同拍 */
  var words = D.lyric || ["方", "块", "在", "响"];
  var ly = document.getElementById("lyric");
  words.forEach(function (w) {
    var sp = document.createElement("span");
    sp.className = "w";
    sp.textContent = w;
    ly.appendChild(sp);
  });
  var ws = ly.querySelectorAll(".w");
  var t0 = INTRO + SONG * 0.38;
  for (var i = 0; i < ws.length; i++) {
    var st = t0 + i * 0.34;
    tl.set(ws[i], { opacity: 0 }, 0);
    tl.fromTo(ws[i], { y: 70, opacity: 0, rotate: -6 },
      { y: 0, opacity: 1, rotate: 0, duration: .26, ease: "power4.out" }, st);
    tl.to(ws[i], { backgroundColor: "#F7CB46", duration: .16, ease: "none" }, st + .06);
    tl.to(ws[i], { y: -46, opacity: 0, duration: .3, ease: "power2.in" }, st + 1.25);
  }

  // 结尾：贴纸放大/淡出（最终段允许 exit）
  tl.to("#lyric", { opacity: 0, duration: .3 }, INTRO + SONG + .3);
  tl.to("#title", { y: -60, opacity: 0, duration: .6, ease: "power3.in" }, INTRO + SONG + .45);
  tl.to("#star1", { scale: 1.2, opacity: 0, duration: .5 }, INTRO + SONG + .5);
  tl.to("#rect1", { x: 200, opacity: 0, duration: .5 }, INTRO + SONG + .5);
  tl.to("#tag, #counter", { opacity: 0, duration: .4 }, INTRO + SONG + .6);

  window.__timelines["styleA"] = tl;
})();
</script>
</body>
</html>
